name: Run Coverage

on:
  pull_request:
    branches: [main] # or any branches you want to target
  push:
    branches: [main]

jobs:
  run_tests:
    name: Unit test coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        # Unit tests only: the docker stacks (tests/integration, tests/mesh_lab)
        # run in their own workflow and in the release gate.
        run: uv run pytest -m "not integration" --cov --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
