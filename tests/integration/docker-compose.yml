services:
  redis:
    image: redis:latest
  db:
    image: jhnnsrs/daten:dev
    restart: always
    environment:
      POSTGRES_MULTIPLE_DATABASES: rekuest, lok
      POSTGRES_PASSWORD: hello_django
      POSTGRES_USER: hello_django
  rekuest:
    depends_on:
    - redis
    - db
    - minio
    image: jhnnsrs/rekuest:${REKUEST_SERVICE_TAG:-next}
    command: bash run-debug.sh
    stop_grace_period: 1s
    # Host ports are picked per-run by tests/conftest.py so parallel or
    # leftover stacks cannot collide on a fixed port.
    ports:
    - "${REKUEST_HOST_PORT}:80"
    volumes:
    - ./configs/rekuest.yaml:/workspace/config.yaml
  lok:
    depends_on:
    - redis
    - db
    - minio
    image: jhnnsrs/lok:${LOK_SERVICE_TAG:-next}
    command: bash run-debug.sh
    stop_grace_period: 1s
    ports:
    - "${LOK_HOST_PORT}:80"
    volumes:
    # Rendered by conftest.py: the advertised rekuest port is only known once
    # the host ports have been picked.
    - "${LOK_CONFIG_FILE}:/workspace/config.yaml"
  minio:
    command: server /data
    environment:
      MINIO_ROOT_PASSWORD: e8821a29d189789e39c9922a3bfcfb4a
      MINIO_ROOT_USER: crappygreysetter
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    ports:
    - "${MINIO_HOST_PORT}:9000"
  initc:
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_HOST: http://minio:9000
      MINIO_ROOT_PASSWORD: e8821a29d189789e39c9922a3bfcfb4a
      MINIO_ROOT_USER: crappygreysetter
    image: jhnnsrs/init:dev
    volumes:
    - ./configs/minio.yaml:/workspace/config.yaml


